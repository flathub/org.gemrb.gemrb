app-id: org.gemrb.gemrb
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: org.gemrb.gemrb.sh

finish-args:
  # gamepad support
  - --device=all
  # X11 + XShm access
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Audio
  - --socket=pulseaudio

cleanup:
  - /share/doc
  - /share/man
  - /share/pixmaps
  - /include
  - '*.a'
  - /lib/cmake

modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=date_time,filesystem,iostreams,program_options
      - ./b2 -j$FLATPAK_BUILDER_N_JOBS install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz
        sha256: 5e93d582aff26868d581a52ae78c7d8edf3f3064742c6e77901a1f18a437eea9
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: https://archives.boost.io/release/$version/source/boost_${major}_${minor}_${patch}.tar.gz

  - name: innoextract
    buildsystem: cmake-ninja
    build-options:
      env:
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    sources:
      - type: archive
        url: https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9.tar.gz
        sha256: 6344a69fc1ed847d4ed3e272e0da5998948c6b828cb7af39c6321aba6cf88126
        x-checker-data:
          type: anitya
          project-id: 8646
          stable-only: true
          url-template: https://github.com/dscharrer/innoextract/releases/download/$version/innoextract-$version.tar.gz
      # Patch innoextract failing to build with boost 1.85+: https://github.com/dscharrer/innoextract/pull/169
      - type: patch
        path: innoextract-169.patch
      # Patch innoextract failing to build with boost 1.85+: https://github.com/dscharrer/innoextract/pull/199
      - type: patch
        path: innoextract-199.patch

  - name: gemrb
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DOPENGL_BACKEND=OpenGL
    sources:
      - type: archive
        url: https://api.github.com/repos/gemrb/gemrb/zipball/v0.9.5
        dest-filename: gemrb.zip
        sha256: 163e27e75dfb003867d29b23212ad8d0941d7db29f7e55346e60db614bfca455
        x-checker-data:
          type: json
          url: https://api.github.com/repos/gemrb/gemrb/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .zipball_url
      # FIXME: remove once GemRB > v0.9.5
      - type: file
        url: https://raw.githubusercontent.com/gemrb/gemrb/e74dbc62f47d02033382ad8fcc0bf5314419b85c/platforms/linux/org.gemrb.gemrb.metainfo.xml
        dest: platforms/linux/
        sha256: d77373c74fa735224158c350ef996b94383e3ef2457eec89e02f8f095220f38f
      # FIXME ends
      - type: script
        dest-filename: org.gemrb.gemrb.sh
        commands:
          - GEMRB_CONFIG_FILE=${XDG_CONFIG_HOME}/gemrb/GemRB.cfg
          # create configuration file directory if needed
          - if [[ ! -d ${XDG_CONFIG_HOME}/gemrb/ ]]; then mkdir -p ${XDG_CONFIG_HOME}/gemrb; fi
          # move configuration files from the original version of the Flatpak
          - if [[ -f ${XDG_CONFIG_HOME}/gemrb.cfg ]]; then mv ${XDG_CONFIG_HOME}/gemrb.cfg ${GEMRB_CONFIG_FILE}; fi
          # If there is no configuration file, copy the default one
          - if [[ ! -f ${GEMRB_CONFIG_FILE} ]]; then cp /app/etc/gemrb/GemRB.cfg ${GEMRB_CONFIG_FILE}; fi
          # fill in $XDG_CACHE_HOME in the configuration file if needed
          - sed -i "s:\$XDG_CACHE_HOME:$XDG_CACHE_HOME:" ${GEMRB_CONFIG_FILE}
          # Run GemRB
          - gemrb $@
    post-install:
      - sed -i "s:CachePath=.*:CachePath=\$XDG_CACHE_HOME/gemrb:" /app/etc/gemrb/GemRB.cfg
      - desktop-file-edit --set-key=Terminal --set-value=false /app/share/applications/org.gemrb.gemrb.desktop
      - install -vD -m755 $FLATPAK_BUILDER_BUILDDIR/org.gemrb.gemrb.sh -t /app/bin
